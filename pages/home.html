<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho 2 semestre</title>
    <link rel="stylesheet" href="../styles/homes.css">
</head>

<body>

    <section>
        <header>
            <div class="containerLogo">
                <img class="logo" src="../assets/logo.png" alt="">
            </div>

            <nav>
                <p>Inicio</p>
                <p>Sobre</p>
                <p>Serviços</p>
                <p>Contato</p>
                <p>Fique por dentro</p>
            </nav>

            <button class="buttonCliente">
                <p>ÁREA DO CLIENTE</p>
            </button>
        </header>

        <div class="bgHome01">
            <div class="cardBgHome01">
                <p class="textTituloCard">
                    Precisão científica <br>
                    para resultados <br>
                    confiáveis
                </p>

                <p class="textCard">
                    Trabalhamos com rigor técnico e <br>
                    metodologias avançadas para <br>
                    garantir análises seguras e de <br>
                    qualidade.
                </p>

                <div class="barCard"></div>

                <button class="servicosButton">
                    <p>Confira nossos serviços</p>
                </button>
            </div>
        </div>

        <img class="buttonWats" src="../assets/whatsap.png" alt="">
    </section>

    <section>
        <div class="bgHome02">
            
            <p class="titleBgHome02">Valores</p>

            <p class="subtitleBgHome02">Que inspiram nossa empresa</p>

            <div class="line"></div>
            <div class="containerCardValores">
                <div class="cardsValores" id="visao">
                    <img class="iconsCardValores" src="../assets/iconVisao.png" alt="">
                    <p class="visao">Visão</p>
                    <div class="lineCardValores"></div>
                </div>
                <div class="cardsValores" id="missao">
                    <img class="iconsCardValores" src="../assets/iconMissao.png" alt="">
                    <p class="missao">Missão</p>
                    <div class="lineCardValores"></div>
                </div>
                <div class="cardsValores" id="valores">
                    <img class="iconsCardValores" src="../assets/iconValores.png" alt="">
                    <p class="valores">Valores</p>
                    <div class="lineCardValores"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="../scripts/home.js"></script>
</body>

</html>
